<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couples Game Hub</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

.hidden{ display:none; }

.container{
    width:100%;
    max-width:420px;
}

/* MENU */
.menuGrid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.menuBox{
    background:#1e1e1e;
    border-radius:18px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
}

.box1{background:#3b82f6;}
.box2{background:#ef4444;}
.box3{background:#22c55e;}
.box4{background:#a855f7;}

/* GAME */
.player{
    color:#ff4da6;
    margin-bottom:5px;
    font-size:18px;
}

.round{
    opacity:0.8;
    margin-bottom:10px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:15px 0;
    font-size:20px;
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:none;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

.truth{ background:#3b82f6; color:white; }
.dare{ background:#ef4444; color:white; }
.back{ background:#444; color:white; }

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">

<h1>Couples Game Hub</h1>

<div class="menuGrid">

    <div class="menuBox box1" onclick="startGame()">
        Truth or Dare
    </div>

    <div class="menuBox box2">
        Coming Soon
    </div>

    <div class="menuBox box3">
        Coming Soon
    </div>

    <div class="menuBox box4">
        Coming Soon
    </div>

</div>

</div>

<!-- GAME -->
<div id="game" class="container hidden">

<h1>Truth or Dare</h1>

<div class="player" id="playerTurn"></div>
<div class="round" id="roundText"></div>

<div class="card" id="challenge">
Διάλεξε Truth ή Dare
</div>

<button class="truth" onclick="getTruth()">Truth</button>
<button class="dare" onclick="getDare()">Dare</button>
<button class="back" onclick="backHome()">Back</button>

</div>

<script>

const dares = {

"Ψιθύρισε κάτι σέξι στο αυτί του/της.",
"Χούφτωσε απαλά πάνω από τα ρούχα."
],
7: [
"Κάνε αισθησιακό massage 2 λεπτά όπου σου ζητηθεί.",
"Άγγιξε τον άλλον απαλά κάτω απο τα ρούχα.",
"Άσε τον άλλον να σε δαγκώσει απαλά όπου θέλει."
],
8: [
"Χόρεψε αισθησιακά για 20 δευτερόλεπτα.",
"Χούφτωσε παθιασμένα τον άλλον.",
"Γλείψε ότι σου ζητήσει ο άλλος."
],
9: [
"Βγάλε ένα ρούχο.",
"Άφησέ τον/την να σου δώσει μια χαλαρή σφαλιάρα όπου θέλει.",
"Κάνε intense φιλί με γλώσσα."
],
10: [
"Handjob or fingering for 20 seconds.",
"Στοματικό σεξ για 30 δευτερόλεπτα.",
"Βγάλε δύο ρούχα για τρεις γύρους.",
"Κάτσε τελείως γυμνός/ή σε ότι στάση θέλει ο άλλος για 15 δευτερόλεπτα",
"Χάιδεψε τον άλλον σε όλο το σώμα.",

"Άσε τον άλλον να σε δαγκώσει όπου θέλει.",

"Handjob ή fingering ενώ ο άλλος σε κοιτάει για 15 δευτερόλεπτα.",
"Δείξε όποια στάση σου πει ο άλλος γυμνός/η.",
"Για δυο γύρες χούφτωνε τον άλλον μέσα από τα ρούχα.",
"Κάνε κάτι με τα πόδια σου."
]
};

/* DIFFICULTY */
function getDifficulty(){
if(round <= 3) return 6;
if(round <= 6) return 7;
if(round <= 9) return 8;
if(round <= 12) return 9;
return 10;
}

/* UI */
function updateUI(){

const d = getDifficulty();

document.getElementById("roundText").innerText =
`Γύρος ${round} • Difficulty ${d}/10`;

let name = currentPlayer === 1 ? player1Name : player2Name;

document.getElementById("playerTurn").innerText =
`Παίζει ο ${name}`;
}

/* GAME FLOW */
function nextTurn(){
round++;
currentPlayer = currentPlayer === 1 ? 2 : 1;
updateUI();
}

function getTruth(){
const d = getDifficulty();
const list = truths[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

function getDare(){
const d = getDifficulty();
const list = dares[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

/* NAVIGATION */
function startGame(){
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
updateUI();
}

function backHome(){
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

round = 1;
currentPlayer = 1;

document.getElementById("challenge").innerText =
"Διάλεξε Truth ή Dare";
}

</script>

</body>
</html>
