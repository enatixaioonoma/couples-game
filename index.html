<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couples Game Hub</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

/* screens */
.hidden{ display:none; }

.container{
    width:100%;
    max-width:420px;
}

/* HOME MENU */
.menuGrid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.menuBox{
    background:#1e1e1e;
    border-radius:18px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.menuBox:active{
    transform:scale(0.96);
}

.box1{background:#3b82f6;}
.box2{background:#ef4444;}
.box3{background:#22c55e;}
.box4{background:#a855f7;}

/* GAME */
.player{
    color:#ff4da6;
    margin-bottom:5px;
}

.round{
    opacity:0.8;
    margin-bottom:10px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:15px 0;
    font-size:20px;
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:none;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

.truth{ background:#3b82f6; color:white; }
.dare{ background:#ef4444; color:white; }
.back{ background:#444; color:white; }

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">

<h1>Couples Game Hub</h1>

<div class="menuGrid">

    <div class="menuBox box1" onclick="startGame()">
        Truth or Dare
    </div>

    <div class="menuBox box2">
        Never Have I Ever
    </div>

    <div class="menuBox box3">
        Spicy Questions
    </div>

    <div class="menuBox box4">
        Coming Soon
    </div>

</div>

</div>

<!-- GAME -->
<div id="game" class="container hidden">

<h1>Truth or Dare</h1>

<div class="player" id="playerTurn">Παίζει ο Παίκτης 1</div>
<div class="round" id="roundText">Γύρος 1 • Difficulty 6/10</div>

<div class="card" id="challenge">Διάλεξε Truth ή Dare</div>

<button class="truth" onclick="getTruth()">Truth</button>
<button class="dare" onclick="getDare()">Dare</button>
<button class="back" onclick="backHome()">Back</button>

</div>

<script>

let round = 1;
let currentPlayer = 1;

/* QUESTIONS */
const truths = {
6: [
"Ποιο είναι το πιο βρώμικο πράγμα που έχεις σκεφτεί για μένα;",
"Ποιο σημείο μου σε ελκύει πιο πολύ;",
"Έχεις φανταστεί ποτέ κάτι μαζί μου;"
],
7: [
"Ποια είναι η πιο τολμηρή σου φαντασίωση;",
"Τι θα ήθελες να δοκιμάσουμε;",
"Ποιο outfit σε ανάβει;"
],
8: [
"Ποια είναι η πιο έντονη σκέψη σου για εμάς;",
"Πού θα ήθελες να γίνει κάτι πιο risky;",
"Τι θες να κάνω σε σένα;"
],
9: [
"Ποιο είναι το πιο άγριο που έχεις σκεφτεί;",
"Πότε ένιωσες πιο δυνατή έλξη;",
"Τι δεν έχεις πει ποτέ;"
],
10: [
"Περιέγραψε τη πιο βρώμικη φαντασίωσή σου.",
"Τι roleplay θες;",
"Ποιο είναι το απόλυτο turn on σου;"
]
};

const dares = {
6: [
"Φίλα με για 10 δευτερόλεπτα.",
"Ψιθύρισέ μου κάτι.",
"Κάτσε κοντά μου."
],
7: [
"Κάνε μου massage.",
"Δείξε seductive look.",
"Φίλα τον λαιμό μου."
],
8: [
"Χόρεψε για μένα.",
"Κάνε μου tease.",
"Πες τι θες να κάνουμε."
],
9: [
"Βγάλε ένα ρούχο.",
"Άσε με να σε οδηγήσω.",
"Κάνε intense φιλί."
],
10: [
"Πες την πιο dirty σκέψη σου.",
"Άσε με να διαλέξω εγώ.",
"Extreme challenge."
]
};

/* DIFFICULTY */
function getDifficulty(){
if(round <= 3) return 6;
if(round <= 6) return 7;
if(round <= 9) return 8;
if(round <= 12) return 9;
return 10;
}

/* UI */
function updateUI(){
const d = getDifficulty();

document.getElementById("roundText").innerText =
`Γύρος ${round} • Difficulty ${d}/10`;

document.getElementById("playerTurn").innerText =
`Παίζει ο Παίκτης ${currentPlayer}`;
}

/* FLOW */
function nextTurn(){
round++;
currentPlayer = currentPlayer === 1 ? 2 : 1;
updateUI();
}

function getTruth(){
const d = getDifficulty();
const list = truths[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

function getDare(){
const d = getDifficulty();
const list = dares[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

/* NAV */
function startGame(){
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
updateUI();
}

function backHome(){
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

round = 1;
currentPlayer = 1;

document.getElementById("challenge").innerText =
"Διάλεξε Truth ή Dare";
}

</script>

</body>
</html>
