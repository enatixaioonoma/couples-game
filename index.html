<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couples Game Hub</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

.hidden{ display:none; }

.container{
    width:100%;
    max-width:420px;
}

/* MENU */
.menuGrid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.menuBox{
    background:#1e1e1e;
    border-radius:18px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
}

.box1{background:#3b82f6;}
.box2{background:#ef4444;}
.box3{background:#22c55e;}
.box4{background:#a855f7;}

/* GAME */
.player{
    color:#ff4da6;
    margin-bottom:5px;
    font-size:18px;
}

.round{
    opacity:0.8;
    margin-bottom:10px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:15px 0;
    font-size:20px;
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:none;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

.truth{ background:#3b82f6; color:white; }
.dare{ background:#ef4444; color:white; }
.back{ background:#444; color:white; }

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">

<h1>Couples Game Hub</h1>

<div class="menuGrid">

    <div class="menuBox box1" onclick="startGame()">
        Truth or Dare
    </div>

    <div class="menuBox box2">
        Never Have I Ever
    </div>

    <div class="menuBox box3">
        Spicy Questions
    </div>

    <div class="menuBox box4">
        Coming Soon
    </div>

</div>

</div>

<!-- GAME -->
<div id="game" class="container hidden">

<h1>Truth or Dare</h1>

<div class="player" id="playerTurn"></div>
<div class="round" id="roundText"></div>

<div class="card" id="challenge">
Διάλεξε Truth ή Dare
</div>

<button class="truth" onclick="getTruth()">Truth</button>
<button class="dare" onclick="getDare()">Dare</button>
<button class="back" onclick="backHome()">Back</button>

</div>

<script>

/* PLAYERS */
let currentPlayer = 1;

const player1Name = "Παναγιώτης (smartest man alive)";
const player2Name = "Ειρήνη (hottest girl alive)";

/* GAME STATE */
let round = 1;

/* DATA */
const truths = {
6: [
"Ποιο είναι το πιο βρώμικο πράγμα που έχεις σκεφτεί για τον/την σύντροφό σου;",
"Τι σε ελκύει πιο πολύ πάνω του/της;",
"Έχεις φανταστεί ποτέ κάτι πιο τολμηρό μαζί του/της;"
],
7: [
"Ποια είναι η πιο έντονη φαντασίωσή σου;",
"Τι θα ήθελες να δοκιμάσετε μαζί;",
"Τι σε ανάβει πιο πολύ;"
],
8: [
"Ποια είναι η πιο risky σκέψη σου;",
"Πού θα ήθελες να γίνει κάτι πιο έντονο;",
"Τι δεν έχεις πει ποτέ;"
],
9: [
"Ποιο είναι το πιο άγριο που έχεις σκεφτεί;",
"Πότε ένιωσες πιο δυνατή έλξη;",
"Τι θα ήθελες να κάνεις χωρίς όρια;"
],
10: [
"Περιέγραψε την πιο έντονη φαντασίωσή σου.",
"Ποιο είναι το απόλυτο turn on σου;",
"Τι θα έκανες αν δεν υπήρχαν όρια;"
]
};

const dares = {
6: [
"Φίλησε τον/την για 10 δευτερόλεπτα.",
"Ψιθύρισε κάτι στο αυτί του/της.",
"Κάτσε πολύ κοντά του/της."
],
7: [
"Κάνε αισθησιακό massage.",
"Δείξε seductive look.",
"Φίλησε τον λαιμό του/της."
],
8: [
"Χόρεψε για 20 δευτερόλεπτα.",
"Κάνε έντονο tease.",
"Πες τι θα ήθελες να γίνει τώρα."
],
9: [
"Βγάλε ένα ρούχο.",
"Άφησέ τον/την να σε καθοδηγήσει για λίγο.",
"Κάνε intense φιλί."
],
10: [
"Πες τη πιο βρώμικη σκέψη σου.",
"Άφησε τον/την να αποφασίσει για σένα.",
"Extreme challenge χωρίς όρια."
]
};

/* DIFFICULTY */
function getDifficulty(){
if(round <= 3) return 6;
if(round <= 6) return 7;
if(round <= 9) return 8;
if(round <= 12) return 9;
return 10;
}

/* UI */
function updateUI(){

const d = getDifficulty();

document.getElementById("roundText").innerText =
`Γύρος ${round} • Difficulty ${d}/10`;

let name = currentPlayer === 1 ? player1Name : player2Name;

document.getElementById("playerTurn").innerText =
`Παίζει ο ${name}`;
}

/* GAME FLOW */
function nextTurn(){
round++;
currentPlayer = currentPlayer === 1 ? 2 : 1;
updateUI();
}

function getTruth(){
const d = getDifficulty();
const list = truths[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

function getDare(){
const d = getDifficulty();
const list = dares[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

/* NAVIGATION */
function startGame(){
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
updateUI();
}

function backHome(){
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

round = 1;
currentPlayer = 1;

document.getElementById("challenge").innerText =
"Διάλεξε Truth ή Dare";
}

</script>

</body>
</html>
