<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couples Game Hub</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

h1{
    font-size:34px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:18px;
    margin:10px 0;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

.menuBtn{
    background:#3b82f6;
    color:white;
}

.backBtn{
    background:#444;
    color:white;
    margin-top:10px;
}

.truth{
    background:#3b82f6;
    color:white;
}

.dare{
    background:#ef4444;
    color:white;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:15px 0;
    font-size:20px;
}

.player{
    color:#ff4da6;
    margin-bottom:5px;
}

.round{
    opacity:0.8;
    margin-bottom:10px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- HOME MENU -->
<div id="home">
    <h1>Couples Game Hub</h1>
    <button class="menuBtn" onclick="startGame()">Truth or Dare</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="hidden">

    <h1>Truth or Dare</h1>

    <div class="player" id="playerTurn">Παίζει ο Παίκτης 1</div>
    <div class="round" id="roundText">Γύρος 1 • Difficulty 6/10</div>

    <div class="card" id="challenge">Διάλεξε Truth ή Dare</div>

    <button class="truth" onclick="getTruth()">Truth</button>
    <button class="dare" onclick="getDare()">Dare</button>

    <button class="backBtn" onclick="backHome()">Back</button>

</div>

</div>

<script>

let round = 1;
let currentPlayer = 1;

const truths = {
6: [
"Ποιο είναι το πιο βρώμικο πράγμα που έχεις σκεφτεί για μένα;",
"Ποιο σημείο του σώματός μου σε ελκύει περισσότερο;",
"Πότε ήταν η τελευταία φορά που φαντασιώθηκες κάτι μαζί μου;"
],
7: [
"Ποια στάση θες να δοκιμάσουμε;",
"Ποιο είναι το πιο τολμηρό πράγμα που θες;",
"Ποιο είναι το πιο sexy outfit που θες να δω;"
],
8: [
"Ποια είναι η πιο έντονη φαντασίωσή σου;",
"Πού θα ήθελες να το κάνουμε πιο risky;",
"Τι θες να κάνουμε περισσότερο;"
],
9: [
"Ποιο είναι το πιο άγριο πράγμα που θες;",
"Πότε ένιωσες πιο έντονη έλξη για μένα;",
"Τι δεν έχεις πει ποτέ;"
],
10: [
"Περιέγραψε τη πιο βρώμικη σκέψη σου.",
"Ποιο roleplay θες;",
"Ποιο είναι το απόλυτο turn on σου;"
]
};

const dares = {
6: [
"Φίλα με για 10 δευτερόλεπτα.",
"Ψιθύρισέ μου κάτι.",
"Κάτσε πάνω μου για λίγο."
],
7: [
"Κάνε αισθησιακό massage.",
"Δείξε seductive look.",
"Φίλα τον λαιμό μου."
],
8: [
"Κάνε tease κίνηση.",
"Χόρεψε για 20 δευτερόλεπτα.",
"Πες τι θες να κάνουμε."
],
9: [
"Βγάλε ένα ρούχο.",
"Κλείσε μάτια και άσε με να σε οδηγήσω.",
"Κάνε intense φιλί."
],
10: [
"Πες πιο dirty σκέψη.",
"Άσε με να διαλέξω εγώ.",
"Extreme tease challenge."
]
};

function getDifficulty(){
if(round <= 3) return 6;
if(round <= 6) return 7;
if(round <= 9) return 8;
if(round <= 12) return 9;
return 10;
}

function updateUI(){
const difficulty = getDifficulty();

document.getElementById("roundText").innerText =
`Γύρος ${round} • Difficulty ${difficulty}/10`;

document.getElementById("playerTurn").innerText =
`Παίζει ο Παίκτης ${currentPlayer}`;
}

function nextTurn(){
round++;
currentPlayer = currentPlayer === 1 ? 2 : 1;
updateUI();
}

function getTruth(){
const d = getDifficulty();
const list = truths[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

function getDare(){
const d = getDifficulty();
const list = dares[d];
document.getElementById("challenge").innerText =
list[Math.floor(Math.random() * list.length)];
nextTurn();
}

function startGame(){
document.getElementById("home").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
updateUI();
}

function backHome(){
document.getElementById("game").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");

round = 1;
currentPlayer = 1;
document.getElementById("challenge").innerText =
"Διάλεξε Truth ή Dare";
}

</script>

</body>
</html>
